services:
  - type: web
    name: arc-gateway
    runtime: python
    repo: https://github.com/YOUR_USERNAME/arc-gateway
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gateway:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ARC_API_KEY
        sync: false
